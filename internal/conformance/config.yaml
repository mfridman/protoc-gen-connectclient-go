# Features of the connectclient transport. The runner tests every
# combination of these with the reference server.
features:
  versions:
    - HTTP_VERSION_1
    - HTTP_VERSION_2
  protocols:
    - PROTOCOL_CONNECT
  codecs:
    - CODEC_PROTO
  compressions:
    - COMPRESSION_IDENTITY
  stream_types:
    - STREAM_TYPE_UNARY
  supports_h2c: true
  supports_tls: true
  supports_tls_client_certs: true
  supports_connect_get: false
  supports_message_receive_limit: true
