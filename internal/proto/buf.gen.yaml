version: v2

clean: true

inputs:
  - directory: internal/proto

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mfridman/protoc-gen-connectclient-go/internal/testdata/gen

plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/testdata/gen
    opt: paths=source_relative
  # Stock connect-go v2 code, used only for the servers in tests.
  - local: [go, tool, protoc-gen-connect-go]
    out: internal/testdata/gen
    opt: paths=source_relative
  - local: ./build/protoc-gen-connectclient-go
    out: internal/testdata/gen
    opt: paths=source_relative
